name: BidCore Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and optional spreadsheet/web adapters
        run: python -m pip install -e '.[spreadsheets,web]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic benchmark
        run: PYTHONPATH=src python tools/run_benchmark.py
