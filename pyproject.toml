[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xelqara-cortex"
version = "0.9.0"
description = "Local-first cognitive context and evidence engine by Xelqara AI"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Xelqara AI"}]
license = {file = "LICENSE"}
classifiers = ["Development Status :: 4 - Beta", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence", "Intended Audience :: Developers", "Intended Audience :: Information Technology"]
dependencies = []

[project.optional-dependencies]
spreadsheets = ["openpyxl>=3.1"]
web = ["flask>=3.0"]

[project.scripts]
cortex = "xelqara_cortex.cli:main"
bidcore = "xelqara_cortex.bid_cli:main"
bidcore-enterprise = "xelqara_cortex.enterprise_cli:main"
bidcore-web = "xelqara_cortex.web_app:main"
bidcore-fill-xlsx = "xelqara_cortex.xlsx_response:main"
bidcore-fill-docx = "xelqara_cortex.docx_response:main"

[tool.setuptools.packages.find]
where = ["src"]
